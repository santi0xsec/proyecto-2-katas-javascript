<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discografía Metal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #1e293b;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #334155;
            text-align: center;
        }
        header h1 {
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            color: #f8fafc;
        }
        main {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 2.5rem auto;
            padding: 0 1rem;
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        li {
            background-color: #0f172a;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            color: #f1f5f9;
        }
        li::before {
            content: "💿";
            margin-right: 0.75rem;
            font-size: 1rem;
        }
        footer {
            text-align: center;
            padding: 1.25rem;
            color: #64748b;
            font-size: 0.8rem;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <header>
        <h1>Metal Vault</h1>
    </header>

    <main>
        <section class="card">
            <h2>Álbumes Clásicos</h2>
            <div id="album-container"></div>
        </section>
    </main>

    <footer>
        <p>Colección personal de discos</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
